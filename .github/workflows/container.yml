name: container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          release="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            release="main"
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "sha=sha-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"
      - name: Build and publish public demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/zeeekrom/rivulet-localops:${{ steps.image.outputs.release }}
            ghcr.io/zeeekrom/rivulet-localops:${{ steps.image.outputs.sha }}
          provenance: mode=max
          sbom: true
