[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rivulet-localops"
version = "0.3.1"
description = "Explainable service-request triage for small Tasmanian councils"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rivulet_localops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
